<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tài liệu in 6B0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* A4 print sheets laid out as physical pages; one committed light look (paper). */
:root{
  --red:#BD0129; --deep:#8E011F; --dark:#51000C; --cream:#F8F7D0; --ink:#1D1D1D; --mute:#5E5A55; --line:#D9CFC0; --desk:#E9E4DC;
  --t-R:#D32F2F; --t-B:#1E63C6; --t-G:#2E8B47; --t-Y:#F2B705;
  --f-head:'Merriweather',Georgia,serif; --f-body:'Be Vietnam Pro',Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{overflow-x:auto}
.stack{display:flex;flex-direction:column;align-items:center;gap:24px;min-width:min-content}
.page{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;padding:14mm 15mm;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:5mm}
.pno{position:absolute;right:15mm;bottom:7mm;font:500 8pt/1 var(--f-body);color:var(--mute)}
.pinfo{position:absolute;left:15mm;bottom:7mm;font:500 8pt/1 var(--f-body);color:var(--mute)}
h1{font:900 26pt/1.15 var(--f-head);color:var(--red);margin:0;text-wrap:balance}
h2{font:900 20pt/1.2 var(--f-head);color:var(--red);margin:0}
h3{font:700 12.5pt/1.3 var(--f-head);color:var(--red);margin:3mm 0 1mm}
p{margin:0 0 2mm}
ul,ol{margin:0 0 2mm;padding-left:5.5mm}
li{margin:.6mm 0}li::marker{color:var(--red);font-weight:800}
.eyebrow{font:800 9.5pt/1 var(--f-body);letter-spacing:2px;color:var(--red);text-transform:uppercase}
.muted{color:var(--mute)}
table{border-collapse:collapse;width:100%}
th{background:var(--deep);color:#fff;text-align:left;font-weight:700;padding:1.8mm 2.5mm}
td{border-bottom:.3mm solid var(--line);padding:1.8mm 2.5mm;vertical-align:top}
.note{background:var(--cream);border-left:1.6mm solid var(--dark);padding:3mm 4mm}
/* index page */
.idx td:nth-child(3){white-space:nowrap}
/* hack card */
.card .top{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;border-bottom:.8mm solid var(--deep);padding-bottom:3mm}
.card .top h1{font-size:28pt}
.card .lad{font:italic 400 10.5pt/1.4 var(--f-body);color:var(--mute);max-width:70mm;text-align:right}
.card .cols{columns:2;column-gap:8mm;font:400 12.3pt/1.5 var(--f-body)}
.card .sec{break-inside:avoid;margin-bottom:1mm}
.card .cols .sec:first-child h3{margin-top:0}
.card .cols>*{break-inside:avoid-column}
.card table{font-size:10.5pt;margin:1mm 0 2mm}
.card .say{margin-top:auto}
.src{font:400 8.5pt/1.4 var(--f-body);color:var(--mute)}
/* cut cards */
.cut{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);flex:1;border:.3mm dashed #999}
.cut>div{border:.3mm dashed #999;padding:4mm;display:flex;flex-direction:column}
.mc{border-radius:3mm;border:2.4mm solid var(--tc);flex:1;display:flex;flex-direction:column;justify-content:center;gap:3mm;padding:4mm 5mm;text-align:center}
.mc .band{font:800 9pt/1 var(--f-body);letter-spacing:1.5px;text-transform:uppercase;color:var(--tc)}
.mc .tx{font:700 15pt/1.35 var(--f-body)}
.abcd{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border:.3mm dashed #999}
.abcd>div{border:.3mm dashed #999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4mm}
.abcd b{width:80%;aspect-ratio:1;border-radius:6mm;background:var(--tc);color:var(--tx);display:grid;place-items:center;font:900 150pt/1 var(--f-head)}
.abcd span{font:700 12pt/1 var(--f-body);color:var(--mute)}
.sign{flex:1;border:3mm solid var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10mm;text-align:center;padding:10mm}
.sign .n{font:900 120pt/1 var(--f-head);color:var(--red)}
.sign .nm{font:900 44pt/1.15 var(--f-head);color:var(--deep);text-wrap:balance}
.sign .hint{font:500 13pt/1.4 var(--f-body);color:var(--mute)}
.strips{flex:1;display:grid;grid-template-rows:repeat(4,1fr);border:.3mm dashed #999}
.strips>div{border:.3mm dashed #999;display:flex;align-items:center;justify-content:center;font:900 30pt/1.1 var(--f-head);color:#fff;text-align:center;padding:4mm;margin:3mm;border-radius:3mm}
/* writing sheet */
.grid10{display:grid;grid-template-columns:22mm repeat(10,1fr);border-top:.4mm solid var(--ink);border-left:.4mm solid var(--ink)}
.grid10>div{border-right:.4mm solid var(--ink);border-bottom:.4mm solid var(--ink);height:11.2mm;display:flex;align-items:center;justify-content:center;font:600 9pt/1 var(--f-body);color:var(--mute)}
.grid10>div.lab{background:#F4EFE6;justify-content:flex-start;padding-left:2mm}
.grid10>div.sep{border-bottom-width:1.2mm}
.fill{border-bottom:.4mm solid var(--ink);display:inline-block;min-width:45mm;height:6mm}
/* team sheet */
.ck td:first-child{width:12mm;text-align:center;font:800 12pt/1 var(--f-body);color:var(--red)}
.ck td:last-child{width:16mm}
.box{display:inline-block;width:8mm;height:8mm;border:.5mm solid var(--ink);border-radius:1mm}
.lines div{border-bottom:.3mm solid var(--line);height:8.6mm}
.assign td{height:13mm}
/* slips */
.slips{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);border:.3mm dashed #999}
.slips>div{border:.3mm dashed #999;padding:5mm 6mm;display:flex;flex-direction:column;gap:3mm;font:400 10.5pt/1.4 var(--f-body)}
.slips b{color:var(--red)}
.slips .ln{border-bottom:.3mm solid var(--ink);height:7mm}
/* poster */
.poster table{font-size:12.5pt}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff;padding:0;margin:0}
  .stack{gap:0}
  .page{box-shadow:none;break-after:page;height:296.5mm}.page:last-child{break-after:auto}
  .screen-only{display:none}
}
.screen-only{max-width:210mm;margin:0 auto 18px;font:400 14px/1.6 var(--f-body);color:var(--ink);background:#fff;border-radius:10px;padding:14px 18px}
</style>

<script>
(()=>{
const TEAMS=[{k:"R",n:"Đỏ"},{k:"B",n:"Xanh dương"},{k:"G",n:"Xanh lá"},{k:"Y",n:"Vàng"}];
const HACK=["Tập trung rồi nghỉ","Tự đố, tự giảng","Rải đều, ngủ đủ","Luyện nhiều chỗ yếu"];
const ACTS=[["Nghĩ mãi không ra tên bài hát, đang tắm thì nhớ ra",0],["Làm bài 25 phút, điện thoại để ở phòng khác",0],["Gấp vở lại rồi viết ra những gì mình nhớ",1],["Giảng bài cho em nhỏ, chỗ vấp là chỗ cần học lại",1],["Ôn 20 phút mỗi tối trong ba tối",2],["Đi ngủ sớm thay vì thức khuya học dồn",2],["Trộn ba dạng toán trong một buổi ôn",3],["Cầu thủ tập sút bằng chân không thuận",3]];
const CHECK=["Cả nhóm thống nhất <b>dàn ý</b> trước khi làm slide.","Mỗi bạn có <b>một phần nội dung</b> riêng, tự viết bằng lời của mình.","Có <b>bảng phân công</b>: ai làm gì, hạn khi nào, cả nhóm cùng thấy.","Không chép nguyên văn từ mạng hay AI; có <b>ghi nguồn</b>.","Mỗi slide <b>một ý chính</b>, chữ ít và đủ to.","Có một bạn <b>kiểm tra</b> thông tin và chính tả trước khi nộp.","Cả nhóm <b>tập nói</b>, ai cũng trình bày được phần mình."];
const CARDS=[
{n:1,t:HACK[0],lad:"Trên thang: hack này cho bạn đủ sức để leo lên các bậc cao.",src:"Nguồn: Oakley, Sejnowski & McConville (2018), Learning How to Learn, chương 2, 3, 7.",body:`
<h3>Trong game giải đố</h3><p>Bạn kẹt ở một màn, thử đi thử lại vẫn thua. Bực mình, bạn đứng dậy đi uống nước, đi lại vài phút. Quay lại chơi, bạn bỗng thấy cách qua màn. Không phải nhờ may mắn: lúc bạn nghỉ, não vẫn làm việc, theo một cách khác.</p>
<h3>Hai chế độ của não</h3><p><b>Chế độ tập trung</b> giống một chiếc đèn pin: soi rất sáng vào một chỗ, giúp bạn đào sâu theo những cách giải mình đã biết.</p><p><b>Chế độ thả lỏng</b> giống bật đèn trần: không sáng bằng, nhưng thấy cả căn phòng, nên nối được những ý ở xa nhau. Nó bật lên lúc bạn nghỉ: nghĩ mãi không ra tên một bài hát, đang tắm thì tự nhiên nhớ ra.</p><p>Hack này là xen kẽ hai chế độ: tập trung hết sức một lúc, rồi nghỉ để chế độ thả lỏng làm việc. Nghỉ không phải là lười.</p>
<h3>Vì sao phải tập trung hết sức</h3><p>Khi làm bài, bạn giữ nhiều thứ trong đầu cùng lúc: đề bài, con số vừa tính, bước tiếp theo. Phần não làm việc này là trí nhớ làm việc, và nó chỉ giữ được khoảng <b>4 thứ</b>. Liếc một tin nhắn là một thứ có thể rơi mất, thậm chí cả 4, và bạn phải nhặt lại từ đầu.</p>
<h3>Ngoài đời cũng thế</h3><ul><li>Trận bóng đá có hai hiệp và một quãng nghỉ ở giữa. Không cầu thủ nào chạy hết sức suốt 90 phút.</li><li>Người chơi cờ giỏi dồn toàn bộ chú ý vào bàn cờ. Không ai vừa đánh cờ vừa xem phim.</li></ul>
<h3>Cách làm: Pomodoro</h3><ol><li>Cất điện thoại sang phòng khác, hoặc tắt hết thông báo.</li><li>Hẹn giờ <b>25 phút</b> và chỉ làm một bài. Hết giờ chưa xong cũng không sao.</li><li>Nghỉ 5 phút: đứng dậy, uống nước, đi lại. Đừng lướt điện thoại.</li><li>Bí quá lâu thì nghỉ hoặc làm bài khác, rồi quay lại: lúc nghỉ là lúc đèn trần tìm đường giúp bạn.</li></ol>`,
say:"Hai chế độ của não giống hai loại đèn nào? Vì sao liếc điện thoại làm mình chậm đi? Tối nay làm gì?"},
{n:2,t:HACK[1],lad:"Trên thang: tự đố là bậc 3, giảng cho người khác là bậc 4.",src:"Nguồn: Roediger & Karpicke (2006), Psychological Science, thí nghiệm 1; Nestojko và cộng sự (2014), Memory & Cognition.",body:`
<h3>Trong game</h3><p>Xem video hướng dẫn chưa làm bạn giỏi lên. Bạn giỏi lên khi vào trận và phải tự nhớ ra nên làm gì. Vì thế game sớm đẩy bạn vào trận thật: mỗi trận là một bài kiểm tra nhỏ.</p>
<h3>Trong não của bạn</h3><p>Đọc lại nhiều lần cho cảm giác quen thuộc, rất dễ nhầm là đã thuộc. Não chỉ nhớ chắc khi phải tự lấy kiến thức ra mà không nhìn vở.</p>
<h3>Vì sao giảng lại còn mạnh hơn</h3><p>Khi giảng, bạn phải xếp ý, nói bằng lời của mình và trả lời khi bị hỏi lại. Chỗ giảng bị vấp là chỗ tưởng hiểu mà chưa. Chỉ cần biết trước mình sắp phải giảng, người ta đã học kỹ hơn.</p>
<h3>Ngoài đời cũng thế</h3><ul><li>Người học cờ tự tìm nước đi trong thế cờ trước, rồi mới xem đáp án.</li><li>Nghe tiếng Anh nhiều giúp bạn hiểu, nhưng phải tự nói ra thì mới nói được.</li></ul>
<h3>Con số đáng nhớ</h3><p>Năm 2006, Roediger và Karpicke cho 120 sinh viên học một bài đọc. Một nhóm đọc hai lần. Nhóm kia đọc một lần, rồi gấp bài lại và tự viết ra những gì mình nhớ.</p>
<table><tr><th></th><th>Sau 5 phút</th><th>Sau 1 tuần</th></tr><tr><td>Nhóm đọc lại</td><td>81%</td><td><b>42%</b></td></tr><tr><td>Nhóm tự nhớ lại</td><td>75%</td><td><b style="color:var(--red)">56%</b></td></tr></table>
<p>Đọc lại thắng nếu bài kiểm tra ở ngay trước mặt. Sau một tuần, nhóm tự nhớ lại nhớ nhiều hơn hẳn.</p>
<h3>Cách làm</h3><ol><li>Gấp vở, viết ra mọi thứ bạn nhớ, rồi mới mở vở ra so.</li><li>Làm thẻ ghi nhớ: mặt trước câu hỏi, mặt sau đáp án, rồi tự đố mình.</li><li>Giảng lại cho bạn bè, em nhỏ hay bố mẹ, rồi học lại đúng chỗ bị vấp.</li></ol>`,
say:"Sau 5 phút và sau 1 tuần khác nhau thế nào? Vì sao giảng lại giúp nhớ hơn? Tối nay làm gì?"},
{n:3,t:HACK[2],lad:"Trên thang: leo lại nhiều ngày, vì không quay lại thì bạn tụt dần xuống.",src:"Nguồn: Oakley, Sejnowski & McConville (2018), chương 6; Cepeda và cộng sự (2006), Psychological Bulletin.",body:`
<h3>Trong game</h3><p>Người làm game muốn bạn chơi lâu dài, nhiều tháng và nhiều năm, chứ không muốn bạn cày một đêm rồi bỏ. Vì thế game có nhiệm vụ hằng ngày và quà đăng nhập. Bạn được thưởng vì quay lại mỗi ngày một chút, chứ không phải vì chơi mười tiếng liền.</p>
<h3>Trong não của bạn</h3><p>Khi bạn học, những mối nối mới giữa các tế bào thần kinh bắt đầu hình thành, nhưng chúng lớn lên nhiều nhất khi bạn ngủ vào đêm hôm đó. Sách <i>Learning How to Learn</i> ví việc này như xây tường gạch: xây quá nhanh khi lớp vữa chưa khô thì tường không vững. Mỗi đêm ngủ là một lần vữa được khô.</p>
<h3>Ngoài đời cũng thế</h3><ul><li>Đội bóng tập vài buổi mỗi tuần, không tập một lần thật dài trước ngày thi đấu.</li><li>Hai người thành bạn thân nhờ gặp và trò chuyện thường xuyên, mỗi lần một chút.</li></ul>
<h3>Một ví dụ</h3><p>Bạn có 60 phút để ôn cho bài kiểm tra sáng thứ Sáu.</p><ul><li><b>Học dồn:</b> 60 phút tối thứ Năm. Nhớ lại 1 lần, lúc bài còn mới.</li><li><b>Rải ra:</b> 20 phút mỗi tối thứ Ba, Tư, Năm. Nhớ lại 3 lần, có <b>2 đêm ngủ</b> xen giữa.</li></ul>
<p>Thời gian như nhau, nhưng rải ra thắng vì hai lý do. Một: tối hôm sau bạn đã quên bớt, nên phải cố nhớ lại, và chính lúc cố nhớ là lúc trí nhớ chắc thêm. Hai: giấc ngủ giữa các lần ôn giúp não củng cố phần đã học.</p>
<h3>Cách làm</h3><ol><li>Biết lịch kiểm tra thì bắt đầu ôn sớm vài ngày, mỗi ngày một ít.</li><li>Mỗi lần ôn, tự đố trước rồi mới mở vở.</li><li>Ngủ đủ giấc: thức khuya học dồn là bỏ mất lúc não củng cố bài.</li></ol>`,
say:"Ví dụ trong game? Giấc ngủ liên quan gì đến nhớ bài? Vì sao cùng 60 phút mà rải ra tốt hơn?"},
{n:4,t:HACK[3],lad:"Trên thang: leo đúng chỗ bạn còn thiếu, thay vì đứng mãi ở bậc đã quen.",src:"Nguồn: Rohrer, Dedrick & Stershic (2015), Psychonomic Bulletin & Review; Oakley và cộng sự (2018).",body:`
<h3>Trong game</h3><p>Màn hướng dẫn chỉ là khởi đầu. Sau đó game liên tục đưa ra thứ mới: lá bài mới, đối thủ mạnh hơn, màn chơi khó hơn một chút. Dễ quá thì bạn chán, khó quá thì bạn bỏ, nên người làm game luôn giữ bạn ở mức “khó vừa đủ”. Nhân vật đánh mãi quái ở màn 1 sẽ không bao giờ lên cấp.</p>
<h3>Trong não của bạn</h3><p>Hồi nhỏ, cô Barbara Oakley, tác giả cuốn <i>Learning How to Learn</i>, tập đàn mỗi ngày nửa tiếng. Nhưng cô chỉ dành khoảng <b>5 phút</b> cho bài mới, còn lại là đánh lại bài đã thuộc. Làm lại phần mình đã giỏi cho ta cảm giác đang học, nhưng ít giúp ta giỏi lên.</p>
<h3>Ngoài đời cũng thế</h3><ul><li>Người chơi cờ tiến bộ nhanh nhất khi đấu với người giỏi hơn mình một chút.</li><li>Cầu thủ giỏi dành thời gian tập chân không thuận, vì đó là chỗ còn yếu.</li></ul>
<h3>Con số đáng nhớ</h3><p>Năm 2015, nhóm giáo sư Rohrer theo dõi 140 học sinh lớp 7 luyện toán trong 9 tuần. Có dạng bài được luyện theo cụm, tức làm liền nhiều bài cùng dạng. Có dạng được luyện trộn với dạng khác. Hai tuần sau, các bạn làm một bài kiểm tra không báo trước.</p>
<table><tr><th>Cách luyện</th><th>Tỷ lệ làm đúng</th></tr><tr><td>Luyện theo cụm</td><td>38%</td></tr><tr><td>Luyện trộn</td><td><b style="color:var(--red)">72%</b></td></tr></table>
<p>Luyện theo cụm thì bạn biết sẵn phải dùng cách nào. Đề kiểm tra không báo trước, nên luyện trộn bắt bạn tập kỹ năng khó nhất: tự nhận ra dạng bài.</p>
<h3>Cách làm</h3><ol><li>Tìm chỗ mình hay sai, nhờ bài kiểm tra cũ hoặc nhận xét của thầy cô.</li><li>Tự làm lại chỗ đó, kiểm tra lỗi, tập thêm vài lần.</li><li>Khi ôn, trộn nhiều dạng bài với nhau. Mệt hơn, nhưng tiến bộ nhanh hơn.</li></ol>`,
say:"Ví dụ trong game? Hai cách luyện toán khác nhau thế nào, vì sao? Tối nay làm gì?"}];

const pages=[];
const P=(html,info,cls="")=>pages.push({html,info,cls});
const tc=k=>`var(--t-${k})`;

/* 1 index */
P(`<div class="eyebrow">Học cách học · lớp 6B0 · thứ Ba 17/11/2026</div><h1>Tài liệu in</h1>
<p class="muted">Tất cả là khổ A4. In 100%, không co giãn. Những trang có thẻ để cắt thì cắt theo đường chấm.</p>
<table class="idx"><tr><th>Trang</th><th>Nội dung</th><th>Số bản</th><th>Ghi chú</th></tr>
<tr><td>2–5</td><td>Bốn thẻ hack (thẻ đọc)</td><td>4 bản mỗi thẻ</td><td>Mỗi đội 1 bộ 4 thẻ. In thêm 1 bộ dự phòng: 20 tờ</td></tr>
<tr><td>6–9</td><td>Thẻ việc làm cho đua ghép thẻ, mỗi đội một màu</td><td>1 bản mỗi trang</td><td>In màu. Cắt 8 thẻ mỗi trang. Xáo trộn trước khi phát</td></tr>
<tr><td>10–13</td><td>Biển 4 ô trên sàn</td><td>1 bản mỗi trang</td><td>Dán xuống sàn cạnh bảng, cách nhau đủ rộng để đi</td></tr>
<tr><td>14–17</td><td>Thẻ đáp án A · B · C · D, mỗi đội một màu</td><td>1 bản mỗi trang</td><td>In màu, cắt 4 thẻ. Dán lên bìa cứng nếu có</td></tr>
<tr><td>18</td><td>Phiếu thi viết · cách A</td><td>5</td><td>4 bạn thi + 1 dự phòng</td></tr>
<tr><td>19</td><td>Phiếu thi viết · cách B</td><td>5</td><td>4 bạn thi + 1 dự phòng</td></tr>
<tr><td>20</td><td>Phiếu đội bài 20/11 (dàn ý và chia việc)</td><td>4</td><td>Mỗi đội một tờ</td></tr>
<tr><td>21</td><td>Phiếu mang về nhà</td><td>2</td><td>Cắt 8 phiếu mỗi tờ, đủ 16 bạn</td></tr>
<tr><td>22</td><td>Luật tính điểm (dán bảng)</td><td>1</td><td>Công bố từ đầu giờ</td></tr></table>
<div class="note"><b>Không có trong bộ này:</b> chuông, băng dính, 40 món quà.</div>`,"Danh mục");

/* 2-5 cards */
CARDS.forEach(c=>P(`<div class="top"><div><div class="eyebrow">Thẻ ${c.n} · đọc trong 4 phút</div><h1>${c.t}</h1></div><div class="lad">${c.lad}</div></div>
<div class="cols">${('<div class="sec">'+c.body.trim().split('<h3>').filter(Boolean).map(x=>'<h3>'+x).join('</div><div class="sec">')+'</div>')}</div>
<div class="note say"><b>Khi giảng cho đội (2 phút, gồm cả hỏi đáp):</b> ${c.say}</div><div class="src">${c.src}</div>`,"Thẻ "+c.n,"card"));

/* 6-9 matching cards */
TEAMS.forEach(t=>P(`<div class="cut">${ACTS.map(a=>`<div><div class="mc" style="--tc:${tc(t.k)}"><div class="band">Đội ${t.n}</div><div class="tx">${a[0]}</div></div></div>`).join("")}</div>`,"Thẻ việc làm · đội "+t.n));

/* 10-13 floor signs */
HACK.forEach((h,i)=>P(`<div class="sign"><div class="n">${i+1}</div><div class="nm">${h}</div><div class="hint">Đặt thẻ việc làm đúng hack này vào ô</div></div>`,"Biển sàn "+(i+1)));

/* answer cards */
TEAMS.forEach(t=>P(`<div class="abcd">${"ABCD".split("").map(L=>`<div style="--tc:${tc(t.k)};--tx:${t.k==="Y"?"#2B2100":"#fff"}"><b>${L}</b><span>Đội ${t.n}</span></div>`).join("")}</div>`,"Thẻ đáp án · đội "+t.n));

/* writing sheets */
const grid=()=>{let s="";for(let r=0;r<16;r++){const chu=r%2===0;s+=`<div class="lab${chu?"":" sep"}">${chu?"Chữ":"Số"}</div>`;for(let c=0;c<10;c++)s+=`<div class="${chu?"":"sep"}"></div>`;}return `<div class="grid10">${s}</div>`};
[["A","Từng việc một","Viết hết dòng chữ, rồi viết hết dòng số. Xong cặp này thì làm tiếp cặp dưới."],["B","Xen kẽ","Viết một chữ ở dòng trên, rồi một số ở dòng dưới ngay bên dưới, rồi chữ tiếp theo, số tiếp theo, cứ thế."]].forEach(([m,nm,how])=>P(`
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:6mm"><div><div class="eyebrow">Vòng 1 · Thi viết · 2 phút</div><h1>Cách ${m}: ${nm}</h1></div><div>Đội: <span class="fill"></span></div></div>
<div class="note"><b>Cách viết:</b> ${how}<br>Dòng chữ: <b>H O C C A C H H O C</b> · Dòng số: <b>1 4 7 10 13 16 19 22 25 28</b> (mỗi ô một chữ hoặc một số)</div>
${grid()}
<div style="display:flex;gap:10mm"><div>Trọng tài (đội): <span class="fill"></span></div><div>Số dòng đúng: <span class="fill" style="min-width:25mm"></span></div></div>
<div class="muted" style="font-size:9pt">Trọng tài chỉ đếm dòng viết đủ 10 ô, đúng thứ tự và đúng cách ${m}. Dòng phạm luật không tính.</div>`,"Phiếu thi viết "+m));

/* 16 team sheet */
P(`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:6mm"><div><div class="eyebrow">Vòng 4 · 15 phút · tính điểm</div><h1>Bài 20/11: dàn ý và chia việc</h1></div></div><div>Đội: <span class="fill"></span></div>
<h3>1. Dàn ý: các slide theo thứ tự</h3><div class="lines"><div></div><div></div><div></div><div></div><div></div><div></div></div>
<h3>2. Phân công: mỗi bạn 1 phần nội dung + 1 việc chung</h3>
<table class="assign"><tr><th style="width:24%">Tên</th><th style="width:34%">Phần nội dung</th><th style="width:26%">Việc chung</th><th style="width:16%">Hạn</th></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr></table>
<p class="muted" style="font-size:9.5pt">Việc chung: tạo file và gửi link · slide bìa và kết luận · kiểm tra thông tin và chính tả · dẫn buổi tập nói. Hạn kiểm tra phải sau hạn làm slide.</p>
<h3>3. Ngày cả nhóm tập nói: <span class="fill"></span></h3>
<div class="note" style="font-size:9.5pt"><b>Cách chấm:</b> đếm số điểm checklist mà phiếu này đã lo được (dàn ý · phần riêng · bảng phân công có hạn · người kiểm tra · ngày tập nói). Không tính nhanh hay chậm.</div>`,"Phiếu đội bài 20/11");

/* 19 slips */
P(`<div class="slips">${Array.from({length:8},()=>`<div><b>Học cách học · 7 ngày thử</b><div>Một môn mình chưa thích:</div><div class="ln"></div><div>Hack mình sẽ thử với môn đó:</div><div class="ln"></div><div class="muted" style="font-size:8.5pt">Dở → Tập → Giỏi → Thích</div></div>`).join("")}</div>`,"Phiếu mang về");

/* 20 poster */
P(`<div class="eyebrow">Công bố từ đầu giờ · dán lên bảng</div><h1>Luật tính điểm</h1>
<table><tr><th>Vòng</th><th>Cách xếp hạng</th><th>Điểm</th></tr>
<tr><td>1 · Thi viết</td><td>Tổng số dòng viết đúng của 2 bạn thi</td><td>4 · 3 · 2 · 2</td></tr>
<tr><td>2 · Chuyên gia</td><td>Số câu cả đội trả lời đúng (4 câu)</td><td>4 · 3 · 2 · 2</td></tr>
<tr><td>Đua ghép thẻ</td><td>Số thẻ đặt đúng ô. Bằng nhau thì đội rung chuông trước xếp trên</td><td>4 · 3 · 2 · 2</td></tr>
<tr><td>3 · Tòa án AI</td><td>Đoán đúng kết cục 2 · lý do đúng 1 · kháng cáo được chấp nhận 1</td><td>tối đa 4</td></tr>
<tr><td>4 · Bài nhóm</td><td>Số điểm checklist phiếu 20/11 đạt được</td><td>4 · 3 · 2 · 2</td></tr>
<tr><td>Chung kết</td><td>3 câu khó, số câu cả đội trả lời đúng, điểm gấp đôi</td><td>8 · 6 · 4 · 4</td></tr>
<tr><td>Giải thích một hack</td><td>Bốc thăm một hack: giải thích đúng 1 · có ví dụ của riêng đội 1</td><td>tối đa 2</td></tr>
<tr><td>Khiên ✋</td><td>Đội trật tự nhanh nhất khi chú giơ tay</td><td>+1, tối đa 3</td></tr>
<tr><td>Phạt</td><td>Chạy hoặc chen lấn khi đua ghép thẻ</td><td>−1</td></tr></table>
<div class="note"><ul><li><b>Đúng</b> quan trọng hơn nhanh.</li><li>Bằng điểm thì cùng hạng cao hơn. Hạng 3 và hạng 4 được điểm bằng nhau.</li><li>Cô Tươi là trọng tài cuối cùng.</li></ul></div>`,"Luật tính điểm","poster");

const st=document.getElementById("stack");
st.innerHTML=pages.map((p,i)=>`<section class="page ${p.cls}"><div class="pinfo">6B0 · ${p.info}</div><div class="pno">${i+1}</div>${p.html}</section>`).join("");
})();
</script>
