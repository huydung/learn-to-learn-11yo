# Publishes slides/ to GitHub Pages on every push to main. The deck opens at the site root.
name: Pages
on:
  push: { branches: [main], paths: ["slides/**", ".github/workflows/pages.yml"] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      # Version the CSS and JS links so browsers load the new files after each deploy
      # (replacing any old ?v= that a save from the live site may have carried into the file).
      - run: |
          sed -i -E "s/(href=\"style\.css|src=\"app\.js)(\?v=[^\"]*)?\"/\1?v=${GITHUB_SHA::7}\"/" slides/6B0slides.html
          cp slides/6B0slides.html slides/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: slides }
      - id: d
        uses: actions/deploy-pages@v4
